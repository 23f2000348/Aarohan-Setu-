{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-8">
        <div class="card shadow-lg border-0">
            <div class="card-header bg-white py-3 border-bottom">
                <h4 class="mb-0 fw-bold text-primary">Create Placement Drive</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-4">
                        <label for="job_title" class="form-label">Job Title</label>
                        <input type="text" class="form-control" name="job_title" placeholder="e.g. Software Engineer"
                            required>
                    </div>
                    <div class="mb-4">
                        <label for="job_description" class="form-label">Job Description</label>
                        <textarea class="form-control" name="job_description" rows="5"
                            placeholder="Describe the role, responsibilities, and perks..." required></textarea>
                    </div>
                    <div class="row mb-4">
                        <div class="col-md-12">
                            <label for="eligibility_criteria" class="form-label">Eligibility Criteria</label>
                            <div class="input-group">
                                <textarea class="form-control" name="eligibility_criteria" rows="3"
                                    placeholder="e.g. Minimum CGPA 7.0, Branches: CSE, IT" required></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="deadline" class="form-label">Application Deadline</label>
                        <input type="datetime-local" class="form-control" name="deadline" required>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('main.dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">Create Drive</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
