{% extends "layout.html" %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
                    <h4 class="mb-0 fw-bold text-primary">Update Profile</h4>
                    <a href="{{ url_for('main.dashboard') }}" class="btn btn-outline-secondary btn-sm">← Back to
                        Dashboard</a>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="full_name" class="form-label fw-semibold">Full Name</label>
                            <input type="text" class="form-control" id="full_name" name="full_name"
                                value="{{ student.full_name }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email" value="{{ student.email }}"
                                required>
                        </div>
                        <div class="mb-3">
                            <label for="contact_number" class="form-label fw-semibold">Contact Number</label>
                            <input type="text" class="form-control" id="contact_number" name="contact_number"
                                value="{{ student.contact_number or '' }}">
                        </div>
                        <div class="mb-3">
                            <label for="cgpa" class="form-label fw-semibold">CGPA</label>
                            <input type="number" step="0.01" min="0" max="10" class="form-control" id="cgpa" name="cgpa"
                                value="{{ student.cgpa or '' }}">
                        </div>
                        <div class="mb-4">
                            <label for="resume_link" class="form-label fw-semibold">Resume Link <span
                                    class="text-muted fw-normal">(Google Drive / URL)</span></label>
                            <input type="url" class="form-control" id="resume_link" name="resume_link"
                                placeholder="https://drive.google.com/..." value="{{ student.resume_link or '' }}">
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{{ url_for('main.dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
