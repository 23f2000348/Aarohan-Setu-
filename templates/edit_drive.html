{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-8">
        <div class="card shadow-lg border-0">
            <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
                <h4 class="mb-0 fw-bold text-primary">Edit Placement Drive</h4>
                <a href="{{ url_for('main.dashboard') }}" class="btn btn-outline-secondary btn-sm">← Back</a>
            </div>
            <div class="card-body p-4">
                {% if drive.status == 'Approved' %}
                <div class="alert alert-warning">
                    ⚠️ This drive is currently <strong>Active</strong>. Editing it will reset it to
                    <strong>Pending</strong> and require admin re-approval.
                </div>
                {% endif %}
                <form method="POST">
                    <div class="mb-4">
                        <label for="job_title" class="form-label fw-semibold">Job Title</label>
                        <input type="text" class="form-control" name="job_title" value="{{ drive.title }}" required>
                    </div>
                    <div class="mb-4">
                        <label for="job_description" class="form-label fw-semibold">Job Description</label>
                        <textarea class="form-control" name="job_description" rows="5"
                            required>{{ drive.job_description }}</textarea>
                    </div>
                    <div class="mb-4">
                        <label for="eligibility_criteria" class="form-label fw-semibold">Eligibility Criteria</label>
                        <textarea class="form-control" name="eligibility_criteria"
                            rows="3">{{ drive.eligibility_criteria or '' }}</textarea>
                    </div>
                    <div class="mb-4">
                        <label for="salary_range" class="form-label fw-semibold">Salary Range <span
                                class="text-muted fw-normal">(optional, e.g. 5 LPA – 8 LPA)</span></label>
                        <input type="text" class="form-control" name="salary_range"
                            value="{{ drive.salary_range or '' }}">
                    </div>
                    <div class="mb-4">
                        <label for="deadline" class="form-label fw-semibold">Application Deadline</label>
                        <input type="datetime-local" class="form-control" name="deadline"
                            value="{{ drive.deadline.strftime('%Y-%m-%dT%H:%M') }}" required>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('main.dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
